<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ptuj folk-art parallax slices</title>
<style>
:root { color-scheme:light; font-family:Georgia,'Times New Roman',serif; background:#e8e0c7; color:#332c20; }
* { box-sizing:border-box; }
body { margin:0; padding:18px; }
main { max-width:1080px; margin:0 auto; }
h1 { margin:0 0 8px; font-size:clamp(1.25rem,2.5vw,1.8rem); font-weight:600; }
p { margin:0 0 12px; line-height:1.45; }
.scene { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; isolation:isolate; background:#6f8494; border:2px solid #54402c; }
.layer { position:absolute; display:block; max-width:none; pointer-events:none; user-select:none; }
.sky { left:-8%; top:-8%; width:116%; height:116%; z-index:0; }
.clouds { left:-4%; top:-4%; width:108%; height:108%; z-index:1; animation:cloud-drift 50s linear infinite; }
.hills { left:0; top:14.9%; width:100%; height:59.2%; z-index:2; }
.castle { left:0; top:11.7%; width:100%; height:38.5%; z-index:3; }
.town { left:0; top:11.2%; width:100%; height:38.3%; z-index:4; }
.water { left:-35%; top:33.5%; width:170%; height:36.1%; z-index:5; }
.reflections { left:-35%; top:33.5%; width:170%; height:36.1%; z-index:6; animation:water-glint 5s ease-in-out infinite alternate; }
.road { left:-68%; top:-36.7%; width:170%; height:136%; z-index:7; }
.oak { left:0; top:0; width:92.8%; height:72.3%; z-index:8; }
.controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-top:12px; }
.progress-control { flex:1 1 240px; display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; }
.progress-control label { font-weight:600; }
#progress { grid-column:1/-1; width:100%; accent-color:#765131; }
button { min-height:44px; padding:8px 14px; border:1px solid #5b4630; border-radius:6px; background:#f5efd9; color:#332c20; font:inherit; font-weight:600; }
button:focus-visible,input:focus-visible { outline:3px solid #265d7a; outline-offset:2px; }
#status { min-width:190px; }
@keyframes cloud-drift { from { translate:0 0; } to { translate:-18px 0; } }
@keyframes water-glint { from { opacity:.55; } to { opacity:.86; } }
@media(max-width:560px) { body { padding:10px; } .controls { gap:8px; } .progress-control { flex-basis:100%; } button { flex:1 1 auto; } #status { flex:1 1 100%; } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
</style>
</head>
<body>
<main>
  <h1>Ptuj, layer by layer</h1>
  <p>Scrub or play a rightward camera pan. The near-bank path moves fastest; the clouds drift slowly above the hills and castle.</p>
  <div id="scene" class="scene" role="img" aria-label="Ptuj folk-painted landscape assembled from separate sky, hills, castle, town, river, reflections, oak, and path layers.">
    <img class="layer sky" src="layers/sky.png" alt="" aria-hidden="true">
    <img class="layer clouds" src="layers/clouds.png" alt="" aria-hidden="true">
    <img class="layer hills" src="layers/distant-hills.png" alt="" aria-hidden="true">
    <img class="layer castle" src="layers/castle-hill.png" alt="" aria-hidden="true">
    <img class="layer town" src="layers/town.png" alt="" aria-hidden="true">
    <img class="layer water" src="layers/drava-water.png" alt="" aria-hidden="true">
    <img class="layer reflections" src="layers/water-reflections.png" alt="" aria-hidden="true">
    <img class="layer road" src="layers/foreground-road.png" alt="" aria-hidden="true">
    <img class="layer oak" src="layers/foreground-oak.png" alt="" aria-hidden="true">
  </div>
  <div class="controls">
    <div class="progress-control">
      <label for="progress">Camera travel</label>
      <output id="progress-value" for="progress">0%</output>
      <input id="progress" type="range" min="0" max="100" step="1" value="0" aria-label="Camera travel across the Ptuj background">
    </div>
    <button id="travel" type="button">Pan across Ptuj</button>
    <span id="status" aria-live="polite">River approach</span>
  </div>
</main>
<script>
const scene=document.getElementById('scene');
const progress=document.getElementById('progress');
const value=document.getElementById('progress-value');
const status=document.getElementById('status');
const button=document.getElementById('travel');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
const layers={
  sky:document.querySelector('.sky'), clouds:document.querySelector('.clouds'), hills:document.querySelector('.hills'),
  castle:document.querySelector('.castle'), town:document.querySelector('.town'), water:document.querySelector('.water'),
  reflections:document.querySelector('.reflections'), road:document.querySelector('.road'), oak:document.querySelector('.oak')
};
const speeds={sky:.08,clouds:.025,hills:.17,castle:.25,town:.33,water:.55,reflections:.58,oak:.82,road:1};
let frame=0,start=0,playing=false;
function clamp(n){return Math.max(0,Math.min(1,n));}
function render(){
  const p=Number(progress.value)/100, ahead=1-p, distance=scene.clientWidth*.68;
  for(const [name,factor] of Object.entries(speeds)) layers[name].style.transform=`translate3d(${Math.round(ahead*distance*factor)}px,0,0)`;
  value.value=`${Math.round(p*100)}%`;
  status.textContent=p>=.99?'Ptuj scene settled':p>=.55?'Approaching Ptuj':'River approach';
  if(p>=1&&playing) stop();
}
function stop(){playing=false;cancelAnimationFrame(frame);button.textContent='Replay pan';}
function tick(now){if(!start)start=now;const p=clamp((now-start)/12000);progress.value=String(Math.round(p*100));render();if(p<1&&playing)frame=requestAnimationFrame(tick);}
progress.addEventListener('input',()=>{stop();render();});
window.addEventListener('resize',render);
button.addEventListener('click',()=>{if(reduced.matches){progress.value='100';render();return;}if(playing){stop();return;}progress.value='0';start=0;playing=true;button.textContent='Pause pan';render();frame=requestAnimationFrame(tick);});
render();
</script>
</body>
</html>
