<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Ptuj battle staging — schematic only</title>
  <desc id="desc">A conceptual 640 by 360 staging guide. The hero group is offset left of centre, with environmental space on both sides. Static foreground props may overlap only below the ankle line.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#182333"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <path d="M0 278H640" stroke="#8da0b5" stroke-opacity=".5" stroke-dasharray="5 5"/>
  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="145" y="92" width="205" height="190" rx="8" fill="#c49a36" fill-opacity=".13" stroke="#e7c46b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="247" y="78" fill="#f5d98b" font-family="monospace" font-size="13" text-anchor="middle">HERO STAGING — LEFT OF CENTRE</text>
  <g fill="#9eb4c8" stroke="#dce7f0" stroke-width="2">
    <circle cx="202" cy="153" r="14"/><path d="M190 170h24l8 48h-40z"/><path d="M190 218l-3 35h10l7-30 7 30h10l-3-35z"/>
    <circle cx="270" cy="153" r="14"/><path d="M258 170h24l8 48h-40z"/><path d="M258 218l-3 35h10l7-30 7 30h10l-3-35z"/>
  </g>
  <path d="M178 253H292" stroke="#e7c46b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="235" y="270" fill="#f5d98b" font-family="monospace" font-size="10" text-anchor="middle">ANKLE LINE (SCHEMATIC)</text>
  <rect x="0" y="282" width="640" height="78" fill="#5f9b75" fill-opacity=".10"/>
  <g fill="#79a77c" stroke="#a9c69e" stroke-width="1.5">
    <path d="M108 314l8-24 8 24 8-18 8 18z"/>
    <path d="M310 316l8-28 8 28 8-20 8 20z"/>
    <path d="M404 316l8-24 8 24 8-19 8 19z"/>
    <path d="M535 316l8-27 8 27 8-18 8 18z"/>
  </g>
  <g fill="#9ba8b6"><ellipse cx="164" cy="326" rx="8" ry="4"/><ellipse cx="365" cy="331" rx="10" ry="4"/><ellipse cx="478" cy="325" rx="7" ry="3"/></g>
  <path d="M0 282H640" stroke="#7dd3a0" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="320" y="347" fill="#b9d6c0" font-family="monospace" font-size="10" text-anchor="middle">STATIC FOREGROUND — OCCASIONAL OVERLAP ONLY BELOW ANKLES</text>
  <text x="16" y="22" fill="#d6e2ef" font-family="monospace" font-size="11">LEFT ENVIRONMENT SPACE</text>
  <text x="624" y="22" fill="#d6e2ef" font-family="monospace" font-size="11" text-anchor="end">RIGHT ENVIRONMENT SPACE</text>
  <text x="320" y="48" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">640×360 REFERENCE ART SPACE — NOT FINAL GAME COORDINATES</text>
</svg>
