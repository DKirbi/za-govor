<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 640 360" shape-rendering="crispEdges">
<style>
@keyframes cloud-drift{from{transform:translateX(-5px)}to{transform:translateX(12px)}}
@keyframes hills-drift{from{transform:translateX(2px)}to{transform:translateX(-2px)}}
@keyframes castle-drift{from{transform:translateX(1px)}to{transform:translateX(-3px)}}
@keyframes town-drift{from{transform:translateX(1px)}to{transform:translateX(-4px)}}
@keyframes water-shimmer{from{transform:translateX(-3px);opacity:.65}to{transform:translateX(3px);opacity:1}}
@keyframes foreground-drift{from{transform:translateX(1px)}to{transform:translateX(-5px)}}
.clouds{animation:cloud-drift 42s linear infinite alternate}
.distant-hills{animation:hills-drift 95s ease-in-out infinite alternate}
.castle-hill{animation:castle-drift 78s ease-in-out infinite alternate}
.old-town{animation:town-drift 68s ease-in-out infinite alternate}
.reflections{animation:water-shimmer 7s ease-in-out infinite alternate}
.foreground{animation:foreground-drift 56s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.clouds,.distant-hills,.castle-hill,.old-town,.reflections,.foreground{animation:none!important}}
</style>
